name: Run Global News Shorts Bot

on:
  push:
    branches: [main]
    paths: [".github/maintenance/run-*.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and render without uploading to YouTube"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: global-news-shorts
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core fontconfig
          sudo fc-cache -fv

          for f in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
            if [ -f "$f" ]; then
              sudo sed -i 's#rights="none" pattern="@\*"#rights="read|write" pattern="@*"#' "$f" || true
              sudo sed -i 's#<policy domain="path" rights="none" pattern="@\*"/>#<policy domain="path" rights="read|write" pattern="@*"/>#' "$f" || true
              sudo sed -i 's#<policy domain="path" rights="none" pattern="@\*" />#<policy domain="path" rights="read|write" pattern="@*" />#' "$f" || true
            fi
          done

          which convert || true
          convert -version || true
          fc-match "DejaVu Sans Bold" || true

      - name: ImageMagick text healthcheck
        run: |
          convert -background none -fill yellow -stroke black -strokewidth 3 -font "DejaVu-Sans-Bold" -pointsize 64 label:'TEST TÜRKÇE İĞÜŞÖÇ' PNG32:/tmp/im_text_test.png
          test -s /tmp/im_text_test.png
          ls -lh /tmp/im_text_test.png

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --upgrade edge-tts
          python -m pip show edge-tts

      - name: Quality regression checks
        run: python -m unittest test_quality_regressions.py

      - name: Check Edge TTS before rendering
        env:
          VOICE: tr-TR-AhmetNeural
          VOICE_RATE: +0%
          VOICE_PITCH: -2Hz
        run: python edge_tts_healthcheck.py

      - name: Run bot
        env:
          TZ: Europe/Istanbul
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          VOICE: tr-TR-AhmetNeural
          VOICE_RATE: +0%
          VOICE_PITCH: -2Hz
          IMAGEMAGICK_BINARY: /usr/bin/convert
          SUBTITLE_FONT: DejaVu-Sans-Bold
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python run_quality_bot.py

      - name: Upload artifact backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-news-shorts
          path: |
            output/*.mp4
            run_report.json
            bot.log
            edge_tts_healthcheck.mp3
          if-no-files-found: warn
          retention-days: 7

      - name: Commit history files
        if: ${{ always() && !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selected_news.json video_plan.json news_history.json
          if [ -f run_report.json ]; then git add -f run_report.json; fi
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "Save news history and plan"
          for attempt in 1 2 3; do
            echo "History push attempt $attempt"
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              echo "History files pushed successfully."
              exit 0
            fi
            sleep 5
          done
          echo "Failed to push history files after retries."
          exit 1
